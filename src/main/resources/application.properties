spring.application.name=url-shortener
spring.config.import=optional:file:./local.properties
spring.mongodb.uri=mongodb://localhost:27017/urlshortener
spring.data.mongodb.auto-index-creation=true
server.port=8081
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=1h
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
